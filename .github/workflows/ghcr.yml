name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 8 * * 1'
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all tags

      - name: Get latest Git tag or use '2'
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "2")
          echo "git_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get current date in YYYYMMDD format
        id: date
        run: |
          DATE=$(date +%Y%m%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.git_tag }}
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.git_tag }}-${{ steps.date.outputs.date }}
          push: ${{ github.event_name != 'pull_request' }}
